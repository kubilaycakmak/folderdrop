name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/desktop.js'
      - 'package*.json'
      - 'src/**'
      - 'bin/**'
      - 'web/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: win32-x64 }
          - { runner: macos-latest, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: folderdrop-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
