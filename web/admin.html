<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FolderDrop · Workspace</title>
  <link rel="stylesheet" href="/assets/style.css?build=@@BUILD@@">
  <script type="module" src="/assets/admin.js?build=@@BUILD@@"></script>
</head>
<body class="admin">
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="FolderDrop workspace"><span class="brand-mark" data-icon="drop"></span>FolderDrop</a>
    <div class="topbar-right"><code id="workspace-build">v@@VERSION@@ · build @@BUILD@@</code></div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <div class="sidebar-heading"><span>Workspace</span><button class="icon-button" id="refresh" aria-label="Refresh deliveries" data-icon="refresh"></button></div>
      <button id="new" class="button primary wide"><span data-icon="plus"></span> New delivery</button>
      <button id="receive-encrypted" class="button wide"><span data-icon="lock"></span> Receive encrypted delivery</button>
      <nav id="deliveries" aria-label="Deliveries"><p class="muted">Loading deliveries…</p></nav>
      <div class="side-bottom">
        <button id="diagnostics" class="button quiet"><span data-icon="settings"></span> Diagnostics</button>
        <button id="quit" class="button quiet"><span data-icon="close"></span> Quit FolderDrop</button>
      </div>
    </aside>
    <main id="main" class="main" tabindex="-1" aria-busy="true"><p class="muted">Opening your workspace…</p></main>
  </div>
  <div role="status" class="toast" id="toast" hidden></div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
</body>
</html>
